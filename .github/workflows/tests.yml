name: Test Suite

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read
    issues: write
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    quality:
        name: Lint and build
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Single source of truth: the same throwaway values the tests use.
            - name: Load .env.test into the job environment
              run: grep -Ev '^\s*(#|$)' .env.test >> "$GITHUB_ENV"

            - name: Generate Prisma client
              run: npm run db:generate

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

    tests:
        name: Run tests
        runs-on: ubuntu-latest
        timeout-minutes: 20

        # Credentials must match DATABASE_URL in .env.test.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: inventory_dev
                    POSTGRES_PASSWORD: change_this_local_password
                    POSTGRES_DB: pos_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U inventory_dev -d pos_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Load .env.test into the job environment
              run: grep -Ev '^\s*(#|$)' .env.test >> "$GITHUB_ENV"

            - name: Generate Prisma client
              run: npm run db:generate

            # The CI database is brand new, so deploy is equivalent to the
            # Makefile's `migrate reset`.
            - name: Apply database migrations
              id: migrate
              run: npm run db:migrate:deploy

            - name: Run unit tests
              id: unit
              run: |
                  npm run test:cov -- \
                    --reporter=default \
                    --reporter=junit \
                    --outputFile.junit=junit-unit.xml

            - name: Run e2e tests
              id: e2e
              if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
              run: |
                  npm run test:e2e -- \
                    --reporter=default \
                    --reporter=junit \
                    --outputFile.junit=junit-e2e.xml

            - name: Upload test reports
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports
                  path: |
                      junit-unit.xml
                      junit-e2e.xml
                      coverage/
                  if-no-files-found: warn
                  retention-days: 14

            - name: Comment test results on PR
              if: >-
                  ${{ !cancelled()
                  && github.event_name == 'pull_request'
                  && github.event.pull_request.head.repo.full_name == github.repository }}
              uses: actions/github-script@v7
              env:
                  MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
                  UNIT_OUTCOME: ${{ steps.unit.outcome }}
                  E2E_OUTCOME: ${{ steps.e2e.outcome }}
              with:
                  script: |
                      const fs = require('fs');

                      const runUrl =
                        `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      const marker = '<!-- inventory-core-test-results -->';

                      const getAttr = (attrs, name) => {
                        const match = attrs.match(
                          new RegExp(`(?:^|\\s)${name}="(\\d+)"`)
                        );
                        return match ? Number(match[1]) : null;
                      };

                      // Returns { total, failures, errors, skipped }, or null if the
                      // report is missing or unreadable.
                      const parseJunit = (path) => {
                        if (!fs.existsSync(path)) return null;
                        const xml = fs.readFileSync(path, 'utf8');

                        let total = 0;
                        let failures = 0;
                        let errors = 0;

                        // Prefer aggregate counts from the root <testsuites> element.
                        const root = xml.match(/<testsuites\b([^>]*)>/);
                        const rootTotal = root ? getAttr(root[1], 'tests') : null;

                        if (rootTotal !== null) {
                          total = rootTotal;
                          failures = getAttr(root[1], 'failures') ?? 0;
                          errors = getAttr(root[1], 'errors') ?? 0;
                        } else {
                          // Fall back to summing individual <testsuite> elements.
                          const suites = [...xml.matchAll(/<testsuite\b([^>]*)>/g)];
                          if (suites.length === 0) return null;
                          for (const suite of suites) {
                            total += getAttr(suite[1], 'tests') ?? 0;
                            failures += getAttr(suite[1], 'failures') ?? 0;
                            errors += getAttr(suite[1], 'errors') ?? 0;
                          }
                        }

                        // Skipped tests are emitted as <skipped/> children.
                        const skipped = (xml.match(/<skipped\b/g) || []).length;

                        return { total, failures, errors, skipped };
                      };

                      const statusLabel = (outcome) => {
                        switch (outcome) {
                          case 'success': return 'Passed';
                          case 'failure': return 'Failed';
                          case 'cancelled': return 'Cancelled';
                          default: return 'Not run';
                        }
                      };

                      const suites = [
                        { label: 'Unit', outcome: process.env.UNIT_OUTCOME, file: 'junit-unit.xml' },
                        { label: 'E2E', outcome: process.env.E2E_OUTCOME, file: 'junit-e2e.xml' },
                      ];

                      let summary = '## Test Suite Results\n\n';

                      if (process.env.MIGRATE_OUTCOME === 'failure') {
                        summary +=
                          '### Database migrations failed\n\n' +
                          'Tests could not run. Check the workflow logs for the Prisma error.\n\n';
                      }

                      summary += '| Suite | Status | Passed | Failed | Errors | Skipped | Total |\n';
                      summary += '|---|---|---:|---:|---:|---:|---:|\n';

                      for (const { label, outcome, file } of suites) {
                        const r = parseJunit(file);
                        const status = statusLabel(outcome);

                        if (!r) {
                          summary += `| ${label} | ${status} | - | - | - | - | - |\n`;
                          continue;
                        }

                        const passed = Math.max(
                          0,
                          r.total - r.failures - r.errors - r.skipped
                        );
                        summary +=
                          `| ${label} | ${status} | ${passed} | ${r.failures} | ` +
                          `${r.errors} | ${r.skipped} | ${r.total} |\n`;
                      }

                      const allPassed = suites.every((s) => s.outcome === 'success');
                      summary += allPassed
                        ? '\n### All tests passed\n\n'
                        : '\n### Tests failed or did not run\n\n';

                      summary += `[View workflow run, reports and coverage](${runUrl})`;
                      summary = `${marker}\n${summary}`;

                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;

                      const comments = await github.paginate(
                        github.rest.issues.listComments,
                        { owner, repo, issue_number, per_page: 100 }
                      );

                      const existing = comments.find(
                        (comment) =>
                          comment.user.type === 'Bot' &&
                          comment.body.includes(marker)
                      );

                      if (existing) {
                        await github.rest.issues.updateComment({
                          owner,
                          repo,
                          comment_id: existing.id,
                          body: summary
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner,
                          repo,
                          issue_number,
                          body: summary
                        });
                      }